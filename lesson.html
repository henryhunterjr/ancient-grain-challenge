<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson | Ancient Grain Challenge</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a href="/"><div class="site-banner"><img src="img/site-header.jpg" alt="Ancient Grain Challenge, Crust &amp; Crumb Academy and Recipe Pantry Ancient Grains" width="2400" height="340" fetchpriority="high"></div></a>
<nav class="topnav" aria-label="Page sections"><div class="wrap">
  <a href="/#lessons">All lessons</a><a href="/#me">Your entry</a><a href="/#winners">Winners</a><a href="/#board-h">Leaderboard</a><a href="/#rules">Rules</a>
</div></nav>

<main class="lesson">
  <section>
    <div class="wrap stack" id="lesson-body">
      <p class="muted">Loading the lesson…</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap stack">
    <p><a href="/#lessons">Back to all lessons</a> · <a href="/#rules">Official rules</a></p>
    <p class="muted">&copy; 2026 Henry Hunter, Crust &amp; Crumb Academy, Baking Great Bread at Home. All rights reserved. Grain provided by Grand Teton Ancient Grains. Questions? Email henrysbreadkitchen@gmail.com.</p>
  </div>
</footer>

<script src="shared.js"></script>
<script>
(() => {
  const { rpc, store, el, LESSONS, videoBox, quizPercentage, lessonProof, taskDescription } = AGC;
  const TOKEN_KEY = "agc_token", YT_KEY = "agc_youtube_name";
  const body = document.getElementById("lesson-body");
  const key = new URLSearchParams(location.search).get("m");

  function fail(text) {
    body.replaceChildren(el("p", { class: "msg err", text }), el("p", {}, el("a", { href: "/#lessons", text: "Back to all lessons" })));
  }

  async function main() {
    let tasks = [];
    try { tasks = await rpc("get_tasks"); } catch { return fail("We couldn't load the lesson. Refresh to try again."); }
    const mods = tasks.filter(t => t.category === "module");
    const i = mods.findIndex(t => t.key === key);
    if (i < 0) return fail("We couldn't find that lesson.");
    const t = mods[i], L = LESSONS[key] || { videos: [], quiz: null };
    const prev = mods[i - 1], next = mods[i + 1];
    document.title = `${t.title} | Ancient Grain Challenge`;

    let progress = null;
    const token = store.get(TOKEN_KEY);
    if (token) { try { progress = await rpc("my_progress", { p_token: token }); } catch {} }
    const claim = progress?.claims?.find(c => c.task_key === key);
    const done = claim?.status === "verified";

    const nav = (cls) => el("nav", { class: "lesson-nav " + cls, "aria-label": "Lesson navigation" },
      prev ? el("a", { href: "lesson?m=" + prev.key, text: "← " + prev.title }) : el("a", { href: "/#lessons", text: "← All lessons" }),
      next ? el("a", { href: "lesson?m=" + next.key, text: next.title + " →" }) : el("a", { href: "/#lessons", text: "All lessons →" }));

    const ytLinks = L.videos.map((id, n) => el("a", { class: "btn-link ghost-link", href: "https://www.youtube.com/watch?v=" + id, target: "_blank", rel: "noopener",
      text: L.videos.length > 1 ? `Comment on video ${n + 1} on YouTube` : "Leave a comment on YouTube" }));

    // Mark-complete block
    let complete;
    const msg = el("span", { class: "msg", role: "status" });
    if (!progress) {
      complete = el("div", { class: "card stack" },
        el("h3", { text: "Track your progress" }),
        el("p", { class: "muted", text: "You're watching as a guest. Register on the challenge page to mark lessons done and enter the drawings." }),
        el("div", {}, el("a", { class: "btn-link", href: "/#me", text: "Register, it's free" })));
    } else if (done) {
      complete = el("div", { class: "card stack" },
        el("div", { class: "status-line" }, el("span", { class: "pill verified", text: "Done" }),
          el("span", { class: "muted", text: `Lesson ${i + 1} of ${mods.length} complete${claim.proof ? ". " + claim.proof : ""}` })),
        el("div", { class: "lesson-nav" }, next
          ? el("a", { class: "btn-link", href: "lesson?m=" + next.key, text: "Next lesson: " + next.title })
          : el("a", { class: "btn-link", href: "/#me", text: "See your entry" })));
    } else {
      const ytName = el("input", { placeholder: "Your YouTube name", value: store.get(YT_KEY) || "", "aria-label": "The YouTube name you commented under", style: "flex:1 1 180px" });
      const score = el("input", { id: "quiz-score", type: "number", min: "0", max: "100", step: "any", required: true, inputmode: "decimal", placeholder: "80", "aria-describedby": "quiz-score-hint", style: "flex:1 1 160px" });
      const btn = el("button", { type: "button", class: "small" }, "I finished this lesson");
      btn.addEventListener("click", async () => {
        const yn = ytName.value.trim();
        if (!yn) { msg.className = "msg err"; msg.textContent = "Add the YouTube name you commented under."; ytName.focus(); return; }
        const percentage = quizPercentage(score.value);
        if (percentage === null) { msg.className = "msg err"; msg.textContent = "Enter your quiz percentage from 0 to 100 (for example, 80)."; score.focus(); return; }
        if (percentage < 70) { msg.className = "msg err"; msg.textContent = "You need 70% or better. Retake the quiz, then enter your passing score."; score.focus(); return; }
        let proof;
        try { proof = lessonProof(yn, percentage); }
        catch { msg.className = "msg err"; msg.textContent = "Enter a YouTube name of 120 characters or fewer, on one line."; ytName.focus(); return; }
        btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
        try {
          store.set(YT_KEY, yn);
          const r = await rpc("claim_task", { p_token: token, p_task_key: key, p_proof: proof });
          if (r.error === "quiz_score") { msg.className = "msg err"; msg.textContent = "Enter a passing quiz percentage from 70 to 100."; btn.disabled = false; return; }
          if (r.error) throw new Error(r.error);
          location.reload();
        } catch { msg.className = "msg err"; msg.textContent = "Couldn't save that. Try again."; btn.disabled = false; }
      });
      complete = el("div", { class: "card stack" },
        el("h3", { text: "Mark it done" }),
        claim?.needs_score ? el("p", { class: "msg err", text: "Your earlier check-off is saved, but it needs a passing quiz percentage to count. Enter your YouTube name and score below." }) : null,
        el("ol", { class: "steps-compact" },
          el("li", { text: "Watch the video." }),
          el("li", { text: "Take the quiz and pass at 70% or better." }),
          el("li", { text: "Leave a comment on the video on YouTube. One line is plenty: what you learned, or a question for me. That comment is your proof." })),
        el("div", { class: "quiz-row" }, ...ytLinks),
        el("p", { class: "muted", text: "Then tell us the YouTube name you commented under and your quiz percentage." }),
        el("label", { for: "quiz-score", text: "Quiz score (%) — required" }),
        el("p", { id: "quiz-score-hint", class: "muted", text: "Enter a number from 0 to 100. For example, 8 out of 10 is 80. You need at least 70 to complete this lesson. Scores are self-reported; we check winners' YouTube comments." }),
        el("div", { class: "task-actions" }, ytName, score, btn, msg));
    }

    body.replaceChildren(
      nav("top"),
      el("p", { class: "lesson-eyebrow", text: `Lesson ${i + 1} of ${mods.length} · ${t.points} points` }),
      el("h1", { text: t.title }),
      el("p", { class: "muted", text: taskDescription(t) }),
      ...(L.videos.length ? L.videos.map((id, n) => videoBox(id, n)) : [el("p", { class: "muted", text: "The video for this lesson is on its way." })]),
      el("div", { class: "quiz-row" },
        L.quiz
          ? el("a", { class: "btn-link", href: L.quiz, target: "_blank", rel: "noopener", text: "Take the quiz (pass at 70%)" })
          : el("span", { class: "muted", text: "Quiz coming soon. Complete this lesson once the quiz is available." })),
      complete,
      nav("bottom"));
  }
  main();
})();
</script>
</body>
</html>
